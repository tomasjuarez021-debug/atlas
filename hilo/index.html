  --line:rgba(239,230,218,.10);
  --line-2:rgba(239,230,218,.18);
  --accent:#d08a4f;
  --accent-soft:rgba(208,138,79,.13);
  --accent-line:rgba(208,138,79,.35);
  --calm:#8fae7d;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --pad:22px;
  --slow:.42s cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  font-family:var(--serif);
  background:var(--bg);
  color:var(--ink);
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
  background-image:radial-gradient(ellipse at 50% -10%, rgba(208,138,79,.07) 0%, transparent 60%);
  background-attachment:fixed;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
textarea,input,select{font-family:inherit;color:inherit;background:none;border:none;outline:none;font-size:16px}

/* ── Estructura ── */
.shell{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px var(--pad) 10px;
}
.mark{
  font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);
  font-weight:400;
}
.mark b{color:var(--accent);font-weight:400}
.menu-btn{
  width:34px;height:34px;display:flex;flex-direction:column;justify-content:center;gap:5px;
  align-items:flex-end;color:var(--muted);
}
.menu-btn i{display:block;height:1px;background:currentColor;width:18px;transition:width .3s}
.menu-btn i:nth-child(2){width:12px}
.menu-btn:active i{width:18px}

.stage{flex:1;display:flex;flex-direction:column;padding:0 var(--pad) 40px}
.screen{flex:1;display:flex;flex-direction:column;animation:enter var(--slow) both}
.screen.leaving{animation:leave .2s ease forwards}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){
  .screen,.screen.leaving{animation:none}
  *{transition:none!important}
}

/* ── Tipografía ── */
.eyebrow{
  font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--faint);
  margin-bottom:26px;
}
.eyebrow.warm{color:var(--accent);opacity:.75}
h1{
  font-size:31px;line-height:1.25;font-weight:400;letter-spacing:-.01em;
  margin-bottom:16px;
}
h1.big{font-size:37px}
.lede{color:var(--ink-2);font-size:18px;line-height:1.65;margin-bottom:12px}
.note{color:var(--muted);font-size:15px;line-height:1.6}
.note-sm{color:var(--faint);font-size:13.5px;line-height:1.6}
.spacer{flex:1;min-height:26px}
em.q{font-style:italic;color:var(--ink)}

/* ── Bloque de escritura ── */
.write{
  width:100%;min-height:180px;resize:none;
  flex:1 1 auto;margin-top:18px;
  font-size:22px;line-height:1.55;color:var(--ink);
  padding:2px 0 10px;
  border-bottom:1px solid var(--line);
  transition:border-color .35s;
}
.write::placeholder{color:var(--faint)}
.write:focus{border-bottom-color:var(--accent-line)}
.write.sm{min-height:130px;font-size:19px}
.counter{font-size:12px;color:var(--faint);letter-spacing:.08em;margin-top:10px;text-align:right}
.counter.ready{color:var(--calm)}

/* ── Acciones ── */
.act{
  display:block;width:100%;text-align:center;
  padding:16px 20px;border-radius:2px;
  border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--ink);
  font-size:16px;letter-spacing:.06em;
  transition:background .3s,border-color .3s,opacity .3s;
  margin-top:28px;
}
.act:active{background:rgba(208,138,79,.22)}
.act[disabled]{opacity:.32;border-color:var(--line);background:transparent;cursor:default}
.act.quiet{border-color:var(--line);background:transparent;color:var(--ink-2)}
.act.quiet:active{background:rgba(239,230,218,.05)}
.act-row{display:flex;gap:12px;margin-top:28px}
.act-row .act{margin-top:0}
.link{
  display:inline-block;color:var(--muted);font-size:14.5px;
  border-bottom:1px solid var(--line-2);padding-bottom:2px;
}
.link:active{color:var(--ink)}
.links{display:flex;gap:26px;justify-content:center;padding-top:34px;flex-wrap:wrap}
.back{
  align-self:flex-start;color:var(--faint);font-size:13.5px;letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:24px;
}

/* ── Tarjetas de recuerdo ── */
.recall{
  border-left:2px solid var(--accent-line);
  padding:4px 0 4px 18px;margin-bottom:26px;
}
.recall .when{
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
  margin-bottom:8px;
}
.recall .body{font-size:20px;line-height:1.55;color:var(--ink);white-space:pre-wrap}
.recall.soft{border-left-color:var(--line-2)}
.recall.soft .body{color:var(--ink-2);font-size:18px}

/* ── Temporizador ── */
.timer-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.timer-task{color:var(--muted);font-size:16px;max-width:22em;margin-bottom:20px}
.timer{
  font-size:74px;line-height:1;letter-spacing:.02em;color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.timer.done{color:var(--calm)}
.ring{position:relative;width:230px;height:230px;display:grid;place-items:center;margin:6px 0 10px}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:1.5}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timer-hint{color:var(--faint);font-size:13.5px;letter-spacing:.06em}

/* ── Lectura ── */
.reader{
  font-size:19px;line-height:1.78;color:var(--ink-2);
  white-space:pre-wrap;word-wrap:break-word;
  padding:8px 0 30px;
}
.reader p{margin-bottom:1.1em}
.read-bar{
  position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;
  padding:10px 0 12px;margin-bottom:6px;
  background:linear-gradient(180deg,var(--bg) 70%,rgba(20,16,13,0));
  font-size:13px;color:var(--faint);letter-spacing:.1em;
}

/* ── Medidas ── */
.metric{padding:24px 0;border-bottom:1px solid var(--line)}
.metric:last-child{border-bottom:none}
.metric .n{font-size:44px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.metric .n small{font-size:16px;color:var(--muted);margin-left:6px}
.metric .l{font-size:15px;color:var(--ink-2);margin-top:10px}
.metric .d{font-size:13px;color:var(--faint);margin-top:5px;line-height:1.55}

/* ── Hilo (narrativa) ── */
.thread-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-top:auto;padding-top:34px;border-top:1px solid var(--line)}
.thread-nav button{color:var(--muted);font-size:13.5px;letter-spacing:.1em;text-transform:uppercase}
.thread-nav button[disabled]{opacity:.25;cursor:default}
.strand{margin-bottom:30px}
.strand .h{
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:9px;
}
.strand .t{font-size:18.5px;line-height:1.62;white-space:pre-wrap;color:var(--ink)}
.strand.dim .t{color:var(--muted);font-size:16px}
.carry{
  display:inline-block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);opacity:.8;margin-bottom:14px;
}

/* ── Ajustes ── */
.field{padding:20px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px}
.field:last-of-type{border-bottom:none}
.field .fl{flex:1}
.field .fn{font-size:16px}
.field .fd{font-size:13px;color:var(--faint);margin-top:4px;line-height:1.5}
.field select,.field input[type=number]{
  border:1px solid var(--line-2);border-radius:2px;padding:9px 10px;
  background:var(--bg-soft);color:var(--ink);min-width:92px;text-align:center;
}
.danger{color:#c98080}

/* ── Menú ── */
.sheet-bg{
  position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.7);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  max-width:560px;margin:0 auto;
  background:var(--bg-soft);border-top:1px solid var(--line-2);
  padding:10px var(--pad) calc(24px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform var(--slow);
}
.sheet.on{transform:none}
.sheet a{
  display:block;padding:17px 2px;color:var(--ink-2);font-size:18px;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.sheet a:last-child{border-bottom:none}
.sheet a.on{color:var(--accent)}

/* ── Aviso efímero ── */
.toast{
  position:fixed;left:50%;bottom:38px;transform:translate(-50%,14px);
  background:var(--bg-card);border:1px solid var(--line-2);
  padding:11px 20px;font-size:14.5px;color:var(--ink-2);
  z-index:60;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
</style>
</head>
<body>

<div class="shell">
  <header class="bar">
    <div class="mark">hi<b>l</b>o</div>
    <button class="menu-btn" id="menuBtn" aria-label="Menú"><i></i><i></i></button>
  </header>
  <main class="stage" id="stage"></main>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<nav class="sheet" id="sheet">
  <a data-go="ahora">Ahora</a>
  <a data-go="hilo">El hilo</a>
  <a data-go="medidas">Medidas</a>
  <a data-go="ajustes">Ajustes</a>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   HILO
   Un archivo. Estado en localStorage detrás de una capa `DB`
   con get/set/update por ruta, para poder mudarlo después a
   Google Sheets (Apps Script) sin tocar los módulos.
   ============================================================ */
(function(){
'use strict';

/* ------------------------------------------------------------
   0 · Utilidades de tiempo
   `now()` es un punto único de lectura del reloj: permite
   probar el reencuentro sin esperar 8 horas reales.
   ------------------------------------------------------------ */
function now(){ return window.__hiloNow ? new Date(window.__hiloNow) : new Date(); }
function p2(n){ return String(n).padStart(2,'0'); }
function dayKey(d){ d = d || now(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function shiftKey(k, n){ var d = new Date(k+'T12:00:00'); d.setDate(d.getDate()+n); return dayKey(d); }
function humanDay(k){
  var d = new Date(k+'T12:00:00');
  var s = d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function relDay(k){
  var t = dayKey();
  if(k===t) return 'Hoy';
  if(k===shiftKey(t,-1)) return 'Ayer';
  return humanDay(k);
}
function hhmm(d){ d = new Date(d); return p2(d.getHours())+':'+p2(d.getMinutes()); }
function faltan(ms){
  if(ms <= 0) return 'ya';
  var m = Math.round(ms/60000), h = Math.floor(m/60);
  m = m % 60;
  if(h && m) return h+' h '+m+' min';
  if(h) return h+(h===1?' hora':' horas');
  return m+' min';
}
function mmss(sec){
  sec = Math.max(0, Math.round(sec));
  return p2(Math.floor(sec/60))+':'+p2(sec%60);
}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ------------------------------------------------------------
   1 · DB — única puerta al almacenamiento
   Trabaja por rutas ('days.2026-08-11.ancla'), así que el día
   que esto viva en una hoja de cálculo sólo cambia esta capa.
   ------------------------------------------------------------ */
var DB = (function(){
  var KEY = 'hilo.v1';
  var cache = null;

  function seed(){
    return {
      version: 1,
      settings: { reencuentroHoras: 8, focoBase: 5, focoMax: 90 },
      days: {},
      meta: { creadoEl: now().toISOString() }
    };
  }
  function load(){
    if(cache) return cache;
    try { cache = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ cache = null; }
    if(!cache || typeof cache !== 'object' || !cache.days){ cache = seed(); persist(); }
    if(!cache.settings) cache.settings = seed().settings;
    return cache;
  }
  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify(cache)); }
    catch(e){ toast('No se pudo guardar: memoria llena'); }
  }
  function walk(path, create){
    var parts = path.split('.'), obj = load();
    for(var i=0;i<parts.length-1;i++){
      if(obj[parts[i]] == null){ if(!create) return null; obj[parts[i]] = {}; }
      obj = obj[parts[i]];
    }
    return { obj: obj, last: parts[parts.length-1] };
  }
  return {
    get: function(path, fallback){
      if(!path) return load();
      var w = walk(path, false);
      if(!w) return fallback;
      var v = w.obj[w.last];
      return v === undefined ? fallback : v;
    },
    set: function(path, value){
      var w = walk(path, true);
      w.obj[w.last] = value; persist(); return value;
    },
    update: function(fn){ var s = load(); fn(s); persist(); return s; },
    all: function(){ return load(); },
    replace: function(obj){ cache = obj; persist(); },
    reset: function(){ cache = seed(); persist(); }
  };
})();

/* ------------------------------------------------------------
   2 · Modelo de día
   ------------------------------------------------------------ */
function blankDay(k){
  return { date:k, ancla:null, conexion:null, foco:[], lecturas:[], carry:null };
}
function getDay(k, create){
  k = k || dayKey();
  var d = DB.get('days.'+k, null);
  if(!d && create){ d = blankDay(k); DB.set('days.'+k, d); }
  return d;
}
function saveDay(d){ DB.set('days.'+d.date, d); }
function dayKeys(){ return Object.keys(DB.get('days', {})).sort(); }
function lastDayWithAncla(beforeKey){
  var ks = dayKeys().filter(function(k){ return k < beforeKey && DB.get('days.'+k+'.ancla'); });
  return ks.length ? ks[ks.length-1] : null;
}

/* ------------------------------------------------------------
   3 · Estado del día: qué corresponde AHORA (una sola cosa)
   ------------------------------------------------------------ */
/* Devuelve { tipo, dia }. El día importa: si escribís el ancla a la
   noche, el reencuentro cae al día siguiente y hay que ir a buscarlo
   al día de ayer, no perderlo. */
function nextAction(){
  var hoy = dayKey(), ayer = shiftKey(hoy, -1), t = now().getTime();
  var dh = getDay(hoy), da = getDay(ayer);

  if(dh && dh.ancla){
    if(!dh.ancla.retomada) return { tipo: t < dh.ancla.vuelveEl ? 'esperando' : 'reencuentro', dia: hoy };
    if(!dh.conexion) return { tipo:'cierre', dia: hoy };
    return { tipo:'nada', dia: hoy };
  }
  // El día todavía no empezó: puede haber algo de ayer sin terminar.
  if(da && da.ancla && !da.ancla.retomada && t >= da.ancla.vuelveEl) return { tipo:'reencuentro', dia: ayer };
  if(da && da.ancla && da.ancla.retomada && !da.conexion) return { tipo:'cierre', dia: ayer };
  return { tipo:'ancla', dia: hoy };
}

/* ------------------------------------------------------------
   4 · Métricas (sobrias, calculadas, nunca acumuladas a mano)
   ------------------------------------------------------------ */
var Medidas = {
  minutosContinuos: function(desdeKey){
    var total = 0;
    dayKeys().forEach(function(k){
      if(desdeKey && k < desdeKey) return;
      (DB.get('days.'+k+'.foco', []) || []).forEach(function(s){
        if(s.completa) total += s.minutos;
      });
    });
    return total;
  },
  sesionesCompletas: function(){
    var n = 0;
    dayKeys().forEach(function(k){
      (DB.get('days.'+k+'.foco', []) || []).forEach(function(s){ if(s.completa) n++; });
    });
    return n;
  },
  // Una idea "sobrevivió 24 h" si al día siguiente el usuario
  // eligió retomarla en lugar de soltarla.
  ideasSobrevividas: function(){
    var n = 0;
    dayKeys().forEach(function(k){
      var a = DB.get('days.'+k+'.ancla', null);
      if(a && a.vieneDe) n++;
    });
    return n;
  },
  anclasTotales: function(){
    return dayKeys().filter(function(k){ return DB.get('days.'+k+'.ancla', null); }).length;
  },
  rachaConexion: function(){
    var k = dayKey(), n = 0;
    if(!DB.get('days.'+k+'.conexion', null)) k = shiftKey(k, -1); // el día en curso todavía no cuenta en contra
    while(DB.get('days.'+k+'.conexion', null)){ n++; k = shiftKey(k, -1); }
    return n;
  },
  lecturas: function(){
    var n = 0, min = 0;
    dayKeys().forEach(function(k){
      (DB.get('days.'+k+'.lecturas', []) || []).forEach(function(l){ n++; min += Math.max(1, Math.round(l.segundos/60)); });
    });
    return { n:n, min:min };
  }
};

/* ------------------------------------------------------------
   5 · Router — una pantalla por vez, sin historial infinito
   ------------------------------------------------------------ */
var Screens = {};
var current = null;
var stage = document.getElementById('stage');

function go(name, params){
  var scr = Screens[name];
  if(!scr) return;
  var old = stage.firstElementChild;
  var paint = function(){
    stage.innerHTML = '';
    var el = document.createElement('section');
    el.className = 'screen';
    var out = scr(params || {});
    el.innerHTML = out.html;
    stage.appendChild(el);
    current = { name:name, params:params||{} };
    if(out.after) out.after(el);
    el.querySelectorAll('[data-go]').forEach(function(b){
      b.addEventListener('click', function(){ go(b.dataset.go, JSON.parse(b.dataset.params || '{}')); });
    });
    window.scrollTo(0,0);
    markMenu(name);
  };
  if(old && !window.matchMedia('(prefers-reduced-motion:reduce)').matches){
    old.classList.add('leaving');
    setTimeout(paint, 170);
  } else paint();
}
function markMenu(name){
  document.querySelectorAll('#sheet a').forEach(function(a){
    a.classList.toggle('on', a.dataset.go === name);
  });
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}
window.toast = toast;

/* ------------------------------------------------------------
   6 · AHORA — el centro. Muestra una sola cosa.
   ------------------------------------------------------------ */
Screens.ahora = function(){
  var st = nextAction(), estado = st.tipo, dia = st.dia;
  var d = getDay(dia), esHoy = dia === dayKey(), html = '';
  var pd = ' data-params=\'{"dia":"' + dia + '"}\'';

  if(estado === 'ancla'){
    html = '<div class="eyebrow">Mañana</div>'
      + '<h1 class="big">¿Qué idea te está dando vueltas?</h1>'
      + '<p class="lede">Escribila y soltala. No la vas a ver hasta la tarde.</p>'
      + '<div class="spacer"></div>'
      + '<button class="act" data-go="ancla_write">Escribir el ancla</button>';
  }
  else if(estado === 'esperando'){
    var falta = d.ancla.vuelveEl - now().getTime();
    html = '<div class="eyebrow">Guardado</div>'
      + '<h1>Tu ancla vuelve en ' + esc(faltan(falta)) + '.</h1>'
      + '<p class="lede">Hasta entonces no está acá. Esa es la idea.</p>'
      + '<div class="spacer"></div>'
      + '<p class="note-sm">Escrita a las ' + hhmm(d.ancla.creadaEl) + ' · vuelve a las ' + hhmm(d.ancla.vuelveEl) + '</p>';
  }
  else if(estado === 'reencuentro'){
    html = '<div class="eyebrow warm">Volvió</div>'
      + '<h1>Escribiste algo ' + (esHoy ? 'esta mañana' : 'ayer') + '.</h1>'
      + '<p class="lede">Es momento de retomarlo.</p>'
      + '<div class="spacer"></div>'
      + '<button class="act" data-go="ancla_return"' + pd + '>Leerlo</button>';
  }
  else if(estado === 'cierre'){
    html = '<div class="eyebrow">Cierre</div>'
      + '<h1>¿Con qué se conectó ' + (esHoy ? 'hoy' : 'ayer') + '?</h1>'
      + '<p class="lede">Atá esa idea con algo que te pasó.</p>'
      + '<div class="spacer"></div>'
      + '<button class="act" data-go="cierre"' + pd + '>Cerrar el día</button>';
  }
  else {
    html = '<div class="eyebrow">Terminado</div>'
      + '<h1 class="big">No hay nada más.</h1>'
      + '<p class="lede">Cerraste el día. Volvé mañana.</p>'
      + '<div class="spacer"></div>'
      + '<p class="note-sm">' + esc(relDay(dayKey())) + ' quedó en el hilo.</p>';
  }

  html += '<div class="links">'
    + '<span class="link" data-go="foco_setup">Sesión de foco</span>'
    + '<span class="link" data-go="lectura_paste">Lectura profunda</span>'
    + '</div>';

  return { html: html };
};

/* ------------------------------------------------------------
   7 · ANCLA — escribir, esperar, reencontrar
   ------------------------------------------------------------ */
Screens.ancla_write = function(params){
  var hoy = dayKey();
  var prevKey = lastDayWithAncla(hoy);
  var prev = prevKey ? DB.get('days.'+prevKey+'.ancla', null) : null;
  var yaDecidio = DB.get('days.'+hoy+'.carry', null);

  // Paso previo: ¿la idea de ayer sigue viva?
  if(prev && !yaDecidio && !params.saltarCarry){
    return {
      html: '<div class="back" data-go="ahora">Volver</div>'
        + '<div class="eyebrow">' + esc(relDay(prevKey)) + '</div>'
        + '<div class="recall"><div class="when">Escribiste</div>'
        + '<div class="body">' + esc(prev.texto) + '</div></div>'
        + (prev.retomada ? '<div class="recall soft"><div class="when">Y a la tarde</div><div class="body">'
            + esc(prev.retomada.texto) + '</div></div>' : '')
        + '<h1>¿Sigue viva?</h1>'
        + '<p class="note">Si la retomás, el hilo continúa. Si la soltás, empezás una nueva. Ninguna de las dos está mal.</p>'
        + '<div class="act-row">'
        + '<button class="act quiet" id="soltar">Soltarla</button>'
        + '<button class="act" id="retomar">Retomarla</button>'
        + '</div>',
      after: function(el){
        function decidir(tipo){
          var d = getDay(hoy, true);
          d.carry = { decision: tipo, de: prevKey, el: now().toISOString() };
          saveDay(d);
          go('ancla_write', { saltarCarry: true });
        }
        el.querySelector('#retomar').addEventListener('click', function(){ decidir('retomada'); });
        el.querySelector('#soltar').addEventListener('click', function(){ decidir('soltada'); });
      }
    };
  }

  var carry = DB.get('days.'+hoy+'.carry', null);
  var sigue = carry && carry.decision === 'retomada';
  var horas = DB.get('settings.reencuentroHoras', 8);

  return {
    html: '<div class="back" data-go="ahora">Volver</div>'
      + '<div class="eyebrow">Ancla · ' + esc(relDay(hoy)) + '</div>'
      + (sigue ? '<div class="recall soft"><div class="when">Venís de</div><div class="body">'
          + esc(DB.get('days.'+carry.de+'.ancla.texto','')) + '</div></div>' : '')
      + '<h1>' + (sigue ? '¿Dónde quedó?' : '¿Qué idea te está dando vueltas?') + '</h1>'
      + '<textarea class="write" id="txt" placeholder="Una idea, una pregunta, algo que observaste…"></textarea>'
      + '<div class="counter" id="cnt"></div>'
      + '<p class="note-sm">Vuelve en ' + horas + ' horas. Hasta entonces no la vas a ver.</p>'
      + '<button class="act" id="guardar" disabled>Guardar y soltar</button>',
    after: function(el){
      var txt = el.querySelector('#txt'), btn = el.querySelector('#guardar'), cnt = el.querySelector('#cnt');
      var MIN = 20;
      txt.addEventListener('input', function(){
        var n = txt.value.trim().length;
        btn.disabled = n < MIN;
        cnt.textContent = n < MIN ? (MIN - n) + ' caracteres más' : '';
        cnt.classList.toggle('ready', n >= MIN);
      });
      setTimeout(function(){ txt.focus(); }, 380);
      btn.addEventListener('click', function(){
        var d = getDay(hoy, true), t = now();
        d.ancla = {
          texto: txt.value.trim(),
          creadaEl: t.getTime(),
          vuelveEl: t.getTime() + horas*3600000,
          retomada: null,
          vieneDe: sigue ? carry.de : null
        };
        saveDay(d);
        go('ancla_saved');
      });
    }
  };
};

/* ------------------------------------------------------------
   9 · FOCO — sesiones progresivas, una sola tarea
   ------------------------------------------------------------ */
var Foco = {
  sesiones: function(){
    var all = [];
    dayKeys().forEach(function(k){
      (DB.get('days.'+k+'.foco', []) || []).forEach(function(s){ all.push(s); });
    });
    return all.sort(function(a,b){ return a.inicio - b.inicio; });
  },
  // Progresión suave: sube 5 min recién cuando repetiste el escalón.
  sugerido: function(){
    var base = DB.get('settings.focoBase', 5), max = DB.get('settings.focoMax', 90);
    var all = this.sesiones();
    if(!all.length) return base;
    var last = all[all.length-1];
    if(!last.completa) return Math.max(base, last.minutos - 5);
    var iguales = 0;
    for(var i = all.length-1; i >= 0; i--){
      if(all[i].completa && all[i].minutos === last.minutos) iguales++;
      else break;
    }
    return Math.min(max, iguales >= 2 ? last.minutos + 5 : last.minutos);
  },
  guardar: function(s){
    var d = getDay(dayKey(), true);
    d.foco.push(s); saveDay(d);
  }
};

Screens.foco_setup = function(){
  var sug = Foco.sugerido(), hechas = Medidas.sesionesCompletas();
  return {
    html: '<div class="back" data-go="ahora">Volver</div>'
      + '<div class="eyebrow">Foco</div>'
      + '<h1>¿Una sola cosa. Cuál?</h1>'
      + '<textarea class="write sm" id="tarea" placeholder="Escribir el informe. Leer el capítulo 4. Ordenar el cuarto." style="min-height:96px;font-size:20px"></textarea>'
      + '<div style="display:flex;align-items:center;gap:18px;margin-top:30px">'
      +   '<button class="act quiet" id="menos" style="margin:0;width:56px;padding:12px 0">−</button>'
      +   '<div style="flex:1;text-align:center"><div style="font-size:38px" id="min">' + sug + '</div>'
      +   '<div class="note-sm" style="letter-spacing:.2em;text-transform:uppercase;font-size:11px">minutos</div></div>'
      +   '<button class="act quiet" id="mas" style="margin:0;width:56px;padding:12px 0">+</button>'
      + '</div>'
      + '<p class="note-sm" style="margin-top:22px">'
      + (hechas ? 'Sugerido por tus últimas sesiones. Subís de a 5 cuando repetís el escalón.'
                : 'Empezás en 5 minutos. En serio: 5.') + '</p>'
      + '<button class="act" id="empezar" disabled>Empezar</button>',
    after: function(el){
      var min = sug;
      var lbl = el.querySelector('#min'), tarea = el.querySelector('#tarea'), btn = el.querySelector('#empezar');
      function sync(){
        lbl.textContent = min;
        btn.disabled = tarea.value.trim().length < 3;
      }
      el.querySelector('#menos').addEventListener('click', function(){ min = Math.max(5, min-5); sync(); });
      el.querySelector('#mas').addEventListener('click', function(){ min = Math.min(DB.get('settings.focoMax',90), min+5); sync(); });
      tarea.addEventListener('input', sync);
      setTimeout(function(){ tarea.focus(); }, 380);
      btn.addEventListener('click', function(){
        go('foco_run', { tarea: tarea.value.trim(), minutos: min });
      });
    }
  };
};

Screens.foco_run = function(params){
  var minutos = params.minutos || 5;
  var total = minutos * 60 * 1000;
  var R = 108, C = 2 * Math.PI * R;
  return {
    html: '<div class="timer-wrap">'
      + '<div class="timer-task">' + esc(params.tarea) + '</div>'
      + '<div class="ring">'
      +   '<svg viewBox="0 0 230 230"><circle class="bg" cx="115" cy="115" r="' + R + '"/>'
      +   '<circle class="fg" id="arc" cx="115" cy="115" r="' + R + '" stroke-dasharray="' + C + '" stroke-dashoffset="0"/></svg>'
      +   '<div class="timer" id="t">' + mmss(minutos*60) + '</div>'
      + '</div>'
      + '<div class="timer-hint" id="hint">No cambies de ventana.</div>'
      + '</div>'
      + '<button class="act quiet" id="salir">Abandonar</button>',
    after: function(el){
      var t0 = Date.now(), fin = t0 + total, cortes = 0, terminado = false;
      var tEl = el.querySelector('#t'), arc = el.querySelector('#arc'), hint = el.querySelector('#hint');

      function tick(){
        if(terminado) return;
        var queda = fin - Date.now();
        if(queda <= 0){
          terminado = true;
          clearInterval(iv);
          document.removeEventListener('visibilitychange', onVis);
          tEl.textContent = '00:00'; tEl.classList.add('done');
          arc.style.strokeDashoffset = C;
          Foco.guardar({
            id: 's' + Date.now(), tarea: params.tarea, minutos: minutos,
            segundos: Math.round(total/1000), completa: true, cortes: cortes,
            inicio: t0, fin: Date.now()
          });
          try{ navigator.vibrate && navigator.vibrate([40,90,40]); }catch(e){}
          setTimeout(function(){ go('foco_done', { minutos: minutos, cortes: cortes }); }, 900);
          return;
        }
        tEl.textContent = mmss(queda/1000);
        arc.style.strokeDashoffset = C * (1 - queda/total);
      }
      var iv = setInterval(tick, 250);
      tick();

      function onVis(){
        if(document.hidden){ cortes++; }
        else if(cortes){ hint.textContent = cortes === 1 ? 'Volviste. Sigue corriendo.' : 'Volviste (' + cortes + ' veces).'; }
      }
      document.addEventListener('visibilitychange', onVis);

      el.querySelector('#salir').addEventListener('click', function(){
        if(!confirm('Si salís ahora, estos minutos no cuentan. ¿Salir igual?')) return;
        terminado = true;
        clearInterval(iv);
        document.removeEventListener('visibilitychange', onVis);
        Foco.guardar({
          id: 's' + Date.now(), tarea: params.tarea, minutos: minutos,
          segundos: Math.round((Date.now()-t0)/1000), completa: false, cortes: cortes,
          inicio: t0, fin: Date.now()
        });
        go('ahora');
      });
    }
  };
};

Screens.foco_done = function(params){
  var total = Medidas.minutosContinuos();
  return {
    html: '<div class="spacer"></div>'
      + '<h1 class="big">' + params.minutos + ' minutos continuos.</h1>'
      + '<p class="lede">Llevás ' + total + ' en total.</p>'
      + (params.cortes ? '<p class="note-sm">Saliste de la app ' + params.cortes + (params.cortes===1?' vez':' veces') + '. Cuenta igual, pero lo sabés.</p>' : '')
      + '<div class="spacer"></div>'
      + '<button class="act quiet" data-go="ahora">Listo</button>'
  };
};

/* ------------------------------------------------------------
   11 · EL HILO — narrativa día por día, hacia atrás
   ------------------------------------------------------------ */
Screens.hilo = function(params){
  var ks = dayKeys().filter(function(k){
    var d = DB.get('days.'+k, {});
    return d && (d.ancla || d.conexion || (d.foco||[]).length || (d.lecturas||[]).length);
  });
  if(!ks.length){
    return { html: '<div class="eyebrow">El hilo</div><h1>Todavía no hay hilo.</h1>'
      + '<p class="lede">Empieza con el ancla de mañana.</p>'
      + '<div class="spacer"></div><button class="act quiet" data-go="ahora">Volver</button>' };
  }
  var k = params.dia && ks.indexOf(params.dia) >= 0 ? params.dia : ks[ks.length-1];
  var i = ks.indexOf(k), d = DB.get('days.'+k, {});
  var mins = (d.foco||[]).reduce(function(s,x){ return s + (x.completa ? x.minutos : 0); }, 0);
  var h = '<div class="eyebrow">' + esc(relDay(k)) + '</div>';

  if(d.ancla && d.ancla.vieneDe) h += '<div class="carry">viene de ' + esc(relDay(d.ancla.vieneDe)) + '</div>';
  if(d.ancla){
    h += '<div class="strand"><div class="h">Mañana</div><div class="t">' + esc(d.ancla.texto) + '</div></div>';
    if(d.ancla.retomada)
      h += '<div class="strand"><div class="h">Tarde</div><div class="t">' + esc(d.ancla.retomada.texto) + '</div></div>';
  }
  if(d.conexion)
    h += '<div class="strand"><div class="h">Noche · conexión</div><div class="t">' + esc(d.conexion.texto) + '</div></div>';
  if(mins || (d.lecturas||[]).length){
    var partes = [];
    if(mins) partes.push(mins + ' min de foco continuo');
    (d.lecturas||[]).forEach(function(l){ partes.push('una lectura de ' + Math.max(1,Math.round(l.segundos/60)) + ' min'); });
    h += '<div class="strand dim"><div class="h">Además</div><div class="t">' + esc(partes.join(' · ')) + '</div></div>';
  }
  if(!d.ancla && !d.conexion) h += '<p class="note">Ese día no dejaste palabras.</p>';

  h += '<div class="thread-nav">'
    + '<button id="prev"' + (i <= 0 ? ' disabled' : '') + '>← Anterior</button>'
    + '<span class="note-sm">' + (i+1) + ' / ' + ks.length + '</span>'
    + '<button id="next"' + (i >= ks.length-1 ? ' disabled' : '') + '>Siguiente →</button>'
    + '</div>';

  return {
    html: h,
    after: function(el){
      var p = el.querySelector('#prev'), n = el.querySelector('#next');
      if(!p.disabled) p.addEventListener('click', function(){ go('hilo', { dia: ks[i-1] }); });
      if(!n.disabled) n.addEventListener('click', function(){ go('hilo', { dia: ks[i+1] }); });
    }
  };
};

      + (lec.n ? '<div class="metric"><div class="n">' + lec.n + '<small>' + (lec.n===1?'lectura':'lecturas') + '</small></div>'
      +   '<div class="l">resumidas con tus palabras</div>'
      +   '<div class="d">' + lec.min + ' minutos leyendo de verdad.</div></div>' : '')
  };
};

/* ------------------------------------------------------------
   13 · AJUSTES
   ------------------------------------------------------------ */
Screens.ajustes = function(){
  var s = DB.get('settings');
  var opts = [4,6,8,10,12].map(function(h){
    return '<option value="'+h+'"'+(s.reencuentroHoras===h?' selected':'')+'>'+h+' h</option>';
  }).join('');
  return {
    html: '<div class="eyebrow">Ajustes</div>'
      + '<div class="field"><div class="fl"><div class="fn">El ancla vuelve</div>'
      +   '<div class="fd">Cuántas horas después de escribirla.</div></div>'
      +   '<select id="reen">' + opts + '</select></div>'
      + '<div class="field"><div class="fl"><div class="fn">Foco inicial</div>'
      +   '<div class="fd">Punto de partida cuando no hay historial.</div></div>'
      +   '<input type="number" id="base" min="5" max="60" step="5" value="' + s.focoBase + '"></div>'
      + '<div class="field"><div class="fl"><div class="fn">Foco máximo</div>'
      +   '<div class="fd">Techo de la progresión.</div></div>'
      +   '<input type="number" id="max" min="10" max="180" step="5" value="' + s.focoMax + '"></div>'
      + '<div style="padding-top:34px">'
      +   '<button class="act quiet" id="exp">Exportar mis datos</button>'
      +   '<button class="act quiet" id="imp">Importar datos</button>'
      +   '<button class="act quiet danger" id="del">Borrar todo</button>'
      + '</div>'
      + '<p class="note-sm" style="padding-top:26px">Todo vive en este teléfono, en el navegador. '
      + 'Nada viaja a ningún servidor. Si borrás los datos del sitio, se va con ellos: exportá de vez en cuando.</p>',
    after: function(el){
      el.querySelector('#reen').addEventListener('change', function(e){
        DB.set('settings.reencuentroHoras', Number(e.target.value)); toast('Guardado');
      });
      el.querySelector('#base').addEventListener('change', function(e){
        DB.set('settings.focoBase', Math.max(5, Number(e.target.value)||5)); toast('Guardado');
      });
      el.querySelector('#max').addEventListener('change', function(e){
        DB.set('settings.focoMax', Math.max(10, Number(e.target.value)||90)); toast('Guardado');
      });
      el.querySelector('#exp').addEventListener('click', function(){
        var blob = new Blob([JSON.stringify(DB.all(), null, 2)], { type:'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'hilo-' + dayKey() + '.json';
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      });
      el.querySelector('#imp').addEventListener('click', function(){
        var inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'application/json,.json';
        inp.addEventListener('change', function(){
          var f = inp.files && inp.files[0];
          if(!f) return;
          var r = new FileReader();
          r.onload = function(){
            try {
              var o = JSON.parse(r.result);
              if(!o || !o.days) throw new Error('formato');
              DB.replace(o); toast('Datos importados'); go('ahora');
            } catch(e){ toast('Ese archivo no es de Hilo'); }
          };
          r.readAsText(f);
        });
        inp.click();
      });
      el.querySelector('#del').addEventListener('click', function(){
        if(!confirm('Se borra todo el hilo: anclas, conexiones, sesiones. No hay vuelta atrás.')) return;
        if(!confirm('¿Seguro? Exportá antes si tenés dudas.')) return;
        DB.reset(); toast('Vacío'); go('ahora');
      });
    }
  };
};

/* ------------------------------------------------------------
   14 · Menú + arranque
   ------------------------------------------------------------ */
var sheet = document.getElementById('sheet'), sheetBg = document.getElementById('sheetBg');
function openSheet(){ sheet.classList.add('on'); sheetBg.classList.add('on'); }
function closeSheet(){ sheet.classList.remove('on'); sheetBg.classList.remove('on'); }
document.getElementById('menuBtn').addEventListener('click', function(){
  sheet.classList.contains('on') ? closeSheet() : openSheet();
});
sheetBg.addEventListener('click', closeSheet);
sheet.querySelectorAll('a[data-go]').forEach(function(a){
  a.addEventListener('click', function(){ closeSheet(); go(a.dataset.go, {}); });
});
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSheet(); });

// El día cambia mientras la app está abierta: al volver, refrescamos.
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && current && current.name === 'ahora') go('ahora');
});

// Service worker: opcional. Si no está el archivo, la app funciona igual.
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* sin SW, sigue andando */ });
  });
}

// API mínima para depurar y para las pruebas automatizadas.
window.Hilo = { DB: DB, go: go, Medidas: Medidas, Foco: Foco, dayKey: dayKey, now: now, getDay: getDay };

go('ahora');
})();
</script>
